<!-- [attr.tuiTheme] is required because tui-root does not set the tuiTheme attribute
     from TUI_DARK_MODE automatically. Taiga UI overlays (dropdowns, hints) read the
     nearest [tuiTheme] ancestor to determine their appearance, and our custom CSS
     variables in _theme.scss also depend on this attribute. -->
<tui-root [attr.tuiTheme]="themeService.themeName()">
  <h1 class="visually-hidden" i18n="Application title@@app.title">Guitar Trainer</h1>
  <app-header />
  <router-outlet />
</tui-root>
