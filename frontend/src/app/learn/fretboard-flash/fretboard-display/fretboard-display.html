<div class="fretboard-wrapper" data-testid="fretboard-wrapper">
  <img
    data-testid="fretboard-image"
    src="/images/fretboard.svg"
    alt="Guitar fretboard"
    class="fretboard-image"
    i18n-alt="Fretboard image alt text@@fretboardFlash.fretboardAlt"
  />
  <div class="fretboard-overlay" data-testid="fretboard-overlay">
    @let n = note();
    @if (n) {
      <div
        class="note-marker"
        data-testid="note-marker"
        [style.left.%]="n.x"
        [style.top.%]="n.y"
        [style.width.%]="markerSizePercent"
      ></div>
    }
  </div>
</div>
