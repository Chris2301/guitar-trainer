<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="fretboard-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a06a"/>
      <stop offset="100%" stop-color="#b8854a"/>
    </linearGradient>
    <linearGradient id="fret-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>

  <!-- Fretboard body -->
  <rect x="30" y="0" width="970" height="200" rx="2" fill="url(#fretboard-bg)"/>

  <!-- Nut (fret 0) - thicker line at the left edge -->
  <line class="nut" x1="30" y1="0" x2="30" y2="200" stroke="#f5f0e0" stroke-width="6"/>

  <!-- Fret lines (frets 1-15) -->
  <!-- Fret positions use the formula: x = 3 + (fret/15)*94 mapped to 1000-unit viewBox -->
  <!-- fret 1: 3 + (1/15)*94 = 9.267% => 92.67 -->
  <line class="fret" x1="92.67" y1="0" x2="92.67" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 2: 3 + (2/15)*94 = 15.533% => 155.33 -->
  <line class="fret" x1="155.33" y1="0" x2="155.33" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 3: 3 + (3/15)*94 = 21.8% => 218 -->
  <line class="fret" x1="218" y1="0" x2="218" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 4: 3 + (4/15)*94 = 28.067% => 280.67 -->
  <line class="fret" x1="280.67" y1="0" x2="280.67" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 5: 3 + (5/15)*94 = 34.333% => 343.33 -->
  <line class="fret" x1="343.33" y1="0" x2="343.33" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 6: 3 + (6/15)*94 = 40.6% => 406 -->
  <line class="fret" x1="406" y1="0" x2="406" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 7: 3 + (7/15)*94 = 46.867% => 468.67 -->
  <line class="fret" x1="468.67" y1="0" x2="468.67" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 8: 3 + (8/15)*94 = 53.133% => 531.33 -->
  <line class="fret" x1="531.33" y1="0" x2="531.33" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 9: 3 + (9/15)*94 = 59.4% => 594 -->
  <line class="fret" x1="594" y1="0" x2="594" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 10: 3 + (10/15)*94 = 65.667% => 656.67 -->
  <line class="fret" x1="656.67" y1="0" x2="656.67" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 11: 3 + (11/15)*94 = 71.933% => 719.33 -->
  <line class="fret" x1="719.33" y1="0" x2="719.33" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 12: 3 + (12/15)*94 = 78.2% => 782 -->
  <line class="fret" x1="782" y1="0" x2="782" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 13: 3 + (13/15)*94 = 84.467% => 844.67 -->
  <line class="fret" x1="844.67" y1="0" x2="844.67" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 14: 3 + (14/15)*94 = 90.733% => 907.33 -->
  <line class="fret" x1="907.33" y1="0" x2="907.33" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>
  <!-- fret 15: 3 + (15/15)*94 = 97% => 970 -->
  <line class="fret" x1="970" y1="0" x2="970" y2="200" stroke="url(#fret-metal)" stroke-width="3"/>

  <!-- Strings (6 strings, horizontal) -->
  <!-- String 1 (high E) at y=8% => 16 -->
  <line class="string" x1="30" y1="16" x2="1000" y2="16" stroke="#d4c5a0" stroke-width="1"/>
  <!-- String 2 (B) at y=25% => 50 -->
  <line class="string" x1="30" y1="50" x2="1000" y2="50" stroke="#c8b890" stroke-width="1.3"/>
  <!-- String 3 (G) at y=42% => 84 -->
  <line class="string" x1="30" y1="84" x2="1000" y2="84" stroke="#b0a070" stroke-width="1.6"/>
  <!-- String 4 (D) at y=58% => 116 -->
  <line class="string" x1="30" y1="116" x2="1000" y2="116" stroke="#908060" stroke-width="2.2"/>
  <!-- String 5 (A) at y=75% => 150 -->
  <line class="string" x1="30" y1="150" x2="1000" y2="150" stroke="#787058" stroke-width="2.8"/>
  <!-- String 6 (low E) at y=92% => 184 -->
  <line class="string" x1="30" y1="184" x2="1000" y2="184" stroke="#686050" stroke-width="3.4"/>

  <!-- Fret markers (dots) -->
  <!-- Single dots at frets 3, 5, 7, 9, 15 - centered between adjacent fret lines -->
  <!-- Fret 3 marker: midpoint between fret 2 (155.33) and fret 3 (218) = 186.67 -->
  <circle class="fret-marker" cx="186.67" cy="100" r="8" fill="#f0e8d0" opacity="0.6"/>
  <!-- Fret 5 marker: midpoint between fret 4 (280.67) and fret 5 (343.33) = 312 -->
  <circle class="fret-marker" cx="312" cy="100" r="8" fill="#f0e8d0" opacity="0.6"/>
  <!-- Fret 7 marker: midpoint between fret 6 (406) and fret 7 (468.67) = 437.33 -->
  <circle class="fret-marker" cx="437.33" cy="100" r="8" fill="#f0e8d0" opacity="0.6"/>
  <!-- Fret 9 marker: midpoint between fret 8 (531.33) and fret 9 (594) = 562.67 -->
  <circle class="fret-marker" cx="562.67" cy="100" r="8" fill="#f0e8d0" opacity="0.6"/>
  <!-- Fret 15 marker: midpoint between fret 14 (907.33) and fret 15 (970) = 938.67 -->
  <circle class="fret-marker" cx="938.67" cy="100" r="8" fill="#f0e8d0" opacity="0.6"/>

  <!-- Double dot at fret 12: midpoint between fret 11 (719.33) and fret 12 (782) = 750.67 -->
  <circle class="fret-marker-double" cx="750.67" cy="66" r="8" fill="#f0e8d0" opacity="0.6"/>
  <circle class="fret-marker-double" cx="750.67" cy="134" r="8" fill="#f0e8d0" opacity="0.6"/>
</svg>
